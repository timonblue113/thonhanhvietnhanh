<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc928">
<title>Thợ Nhanh &amp; Việc Nhanh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f4f5f2;--surf:#fff;--ink:#14263a;--mut:#667587;--line:#e3e6e1;--y:#ffc928;--y2:#ffe08a;--ok:#1d7a4d;--bad:#b3261e;--navy:#14263a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1824;--surf:#172637;--ink:#e8edf2;--mut:#9aa8b6;--line:#2a3b4e;--ok:#4cc38a;--bad:#ff8a80;--navy:#0a121b;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(92px + env(safe-area-inset-bottom,0))}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.hero{background:linear-gradient(160deg,var(--y),#ffb300);color:#14263a;padding:calc(14px + env(safe-area-inset-top,0)) 16px 56px;border-radius:0 0 28px 28px}
.hero.sm{padding-bottom:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hi{font-weight:800;font-size:18px;line-height:1.2}.hi small{display:block;font-weight:500;font-size:13px;opacity:.75}
.loc{border:0;background:rgba(255,255,255,.55);color:#14263a;font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer}
.search{position:relative;margin-top:14px}
.search input{width:100%;font:inherit;border:0;border-radius:14px;padding:13px 14px 13px 42px;background:#fff;color:#14263a;box-shadow:0 4px 14px rgba(20,38,58,.15)}
.search i{position:absolute;left:14px;top:12px;font-style:normal}
#sug{position:absolute;left:0;right:0;top:50px;background:var(--surf);color:var(--ink);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:6;overflow:hidden}
#sug button{display:flex;gap:10px;width:100%;border:0;background:none;color:inherit;font:inherit;padding:10px 14px;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.pad{padding:0 16px}
.float{margin-top:-38px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--surf);border-radius:16px;padding:12px 6px;box-shadow:0 4px 16px rgba(20,38,58,.1)}
.quick button{border:0;background:none;color:var(--ink);font:inherit;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.ic{width:46px;height:46px;border-radius:14px;background:var(--y2);display:flex;align-items:center;justify-content:center;font-size:22px;color:#14263a}
.banner{margin:14px 0;border-radius:16px;background:var(--navy);color:#fff;padding:14px 16px}
.banner b{color:var(--y)}.banner .st{display:flex;gap:14px;margin-top:8px;font-size:13px;opacity:.9;flex-wrap:wrap}
.sec{background:var(--surf);border-radius:16px;padding:14px;margin-bottom:12px}
.sec h2{display:flex;align-items:center;justify-content:space-between;font-size:16px;margin:0 0 12px}
.badge{font-size:11px;font-weight:700;background:var(--y);color:#14263a;padding:3px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;background:none;color:var(--ink);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;padding:4px 2px}
.tile .ic{width:58px;height:58px;font-size:28px;border-radius:18px}
.tile:active .ic,.quick button:active .ic{transform:scale(.94)}
.card{background:var(--surf);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.job{display:flex;gap:12px}.job .ic{flex:none;width:44px;height:44px;font-size:22px}.job .bd{flex:1;min-width:0}
.job h3{margin:0;font-size:15px;line-height:1.3}
.job img.ph{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:8px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.dist{font-weight:800;white-space:nowrap;background:var(--y2);color:#14263a;padding:2px 10px;border-radius:999px;font-size:13px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.w{color:#9a6b00;border-color:#e0a800}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px}
textarea{min-height:84px}
.btn{border:0;font:inherit;font-weight:800;background:var(--y);color:#14263a;padding:13px 16px;border-radius:12px;cursor:pointer;width:100%;font-size:15px}
.btn.sec{background:none;color:var(--ink);border:1.5px solid var(--ink)}.btn.bad{background:none;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{width:auto;padding:7px 14px;font-size:13px}.btn:disabled{opacity:.5;cursor:wait}
.contact{background:color-mix(in srgb,var(--ok) 14%,var(--surf));border:1px solid var(--ok);border-radius:10px;padding:9px 11px;margin-top:10px;font-weight:700}
.lnk{display:inline-block;background:var(--navy);color:#fff;padding:6px 14px;border-radius:999px;text-decoration:none;font-size:13px}
.star{color:#d99a00;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer}
.chips button.on{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
.stars{display:flex;gap:4px}.stars button{border:0;background:none;font-size:36px;line-height:1;color:var(--line);cursor:pointer;padding:0 2px}.stars button.on{color:#ffb300}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.nav div{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 4px 8px}
.nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
.nav button span{font-size:21px;line-height:1.2}.nav button.on{color:var(--ink);font-weight:800}
.nav button.ctr span{width:54px;height:54px;border-radius:50%;background:var(--y);color:#14263a;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-26px;box-shadow:0 4px 12px rgba(255,179,0,.55);border:4px solid var(--surf)}
.sk{height:84px;border-radius:14px;margin-bottom:12px;background:linear-gradient(90deg,var(--line),var(--surf),var(--line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.role{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role button{border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;border-radius:14px;padding:14px 8px;cursor:pointer;font-weight:700}.role button.on{border-color:var(--y);background:var(--y2);color:#14263a}.role span{display:block;font-size:30px}
.av{width:72px;height:72px;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#14263a;margin:0 auto 8px}
svg.radar{width:100%;max-width:300px;display:block;margin:0 auto}
.chipcol{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.nav button{position:relative}
.dot{position:absolute;top:0;right:20%;background:#e53935;color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:170px}
.b{max-width:78%;background:var(--surf);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;align-self:flex-start;word-break:break-word}
.b.me{align-self:flex-end;background:var(--y2);color:#14263a;border-color:var(--y);border-radius:16px 16px 4px 16px}
.b small{display:block;font-size:10px;opacity:.6;margin-top:2px}
.chatbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surf);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0))}
.chatbar>div{max-width:560px;margin:0 auto}
.chatbar textarea{min-height:44px;max-height:110px;resize:none;flex:1}
</style>
</head>
<body>
<div class="app"><main id="main"></main></div>
<nav class="nav" id="nav" hidden></nav>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var CFG=window.CFG||{};
if(!CFG.SUPABASE_URL||CFG.SUPABASE_URL.indexOf("YOUR-")>=0||typeof supabase==="undefined"){
  $("main").innerHTML='<div class="pad" style="padding-top:40px"><div class="card"><h3>Chưa cấu hình Supabase</h3><p>Mở <b>web/config.js</b>, dán Project URL và anon key, rồi tải lại trang.</p></div></div>';return}
var sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
var SUBS={camera:["📹|Lắp camera mới","🛠️|Sửa camera, đầu ghi","📱|Cài xem từ xa","🔌|Kéo dây camera"],
mang:["📶|Wi-Fi yếu, mất sóng","🌐|Kéo dây mạng","⚙️|Cấu hình router","📡|Lắp thêm access point"],
lanh:["❄️|Sửa máy lạnh","🧼|Vệ sinh máy lạnh","💨|Bơm gas máy lạnh","🏠|Lắp máy lạnh mới","🧊|Sửa tủ lạnh","🧺|Sửa máy giặt"],
may:["💻|Laptop không lên nguồn","🪟|Cài Windows","🧹|Vệ sinh laptop, PC","🐢|Máy chạy chậm, virus","🖨️|Sửa máy in"],
dien:["💡|Sửa điện","🔌|Lắp đặt điện","🚰|Sửa ống nước","🪠|Thông cống nghẹt","🚿|Lắp thiết bị vệ sinh","⚡|Chập điện, mất điện"],
khoa:["🔑|Mở khóa cửa","🔐|Thay ruột khóa","🗝️|Làm chìa khóa","📲|Lắp khóa điện tử"]};
var S={chat:null,unread:{},ch:null,sending:false,user:null,prof:null,services:[],stats:null,nav:"home",mode:"login",role:"customer",loc:{lat:10.46,lng:105.633,gps:false},radius:15,fsvc:0,
  form:{svc:0,title:"",desc:"",addr:""},file:null,prev:null,rate:null,stars:0,comment:"",busy:false,rid:0,last:""};

function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3500)}
function fail(e){var m=e&&e.message?e.message:"Có lỗi xảy ra";
  if(/Invalid login/i.test(m))m="Sai số điện thoại hoặc mật khẩu";
  else if(/already registered/i.test(m))m="Số điện thoại này đã đăng ký. Hãy đăng nhập";
  else if(/Failed to fetch|NetworkError/i.test(m))m="Mất kết nối mạng. Hãy thử lại";
  else if(/rate limit/i.test(m))m="Thao tác quá nhanh, hãy đợi một chút";
  toast(m)}
function normPhone(p){p=String(p||"").replace(/[\s.\-()]/g,"");if(p.indexOf("+84")===0)p="0"+p.slice(3);else if(p.indexOf("84")===0&&p.length===11)p="0"+p.slice(2);return p}
function fmtPhone(p){return String(p).replace(/^(\d{4})(\d{3})(\d{3})$/,"$1 $2 $3")}
function fmtD(d){return d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km"}
function ago(t){var m=Math.max(0,Math.round((Date.now()-new Date(t))/60000));if(m<1)return"vừa xong";if(m<60)return m+" phút trước";if(m<1440)return Math.floor(m/60)+" giờ trước";return Math.floor(m/1440)+" ngày trước"}
function svc(id){return S.services.filter(function(x){return x.id===id})[0]||{icon:"🛠️",name:"",slug:""}}
function stars(n){n=Math.round(n);return"★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}
function rateTxt(r){return r&&r.cnt>0?'<span class="star">★ '+r.avg+'</span> ('+r.cnt+' đánh giá)':'<span class="mut">Chưa có đánh giá</span>'}
function statusTag(s){var m={open:["Chờ thợ","w"],taken:["Thợ đang xử lý","ok"],done:["Hoàn thành","ok"],cancelled:["Đã hủy","bad"]}[s]||[s,""];return'<span class="tag '+m[1]+'">'+m[0]+'</span>'}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d")}
function contact(c,label){if(!c)return"";var p=c.phone||"";
  return'<div class="contact"><div>'+label+" "+esc(c.full_name)+'</div>'+(c.rating?'<div>'+rateTxt(c.rating)+'</div>':"")+
  '<div class="row" style="justify-content:flex-start;margin-top:8px"><a class="lnk" href="tel:'+esc(p)+'">📞 '+esc(fmtPhone(p))+'</a><a class="lnk" target="_blank" rel="noopener" href="https://zalo.me/'+esc(p)+'">Zalo</a></div></div>'}
function shrink(f){return new Promise(function(res,rej){var i=new Image();i.onload=function(){var k=Math.min(1,800/i.width),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej(new Error("Không đọc được ảnh"))},"image/jpeg",.75)};i.onerror=function(){rej(new Error("Không đọc được ảnh"))};i.src=URL.createObjectURL(f)})}
async function act(fn,done){if(S.busy)return;S.busy=true;try{await fn();if(done)toast(done)}catch(x){fail(x)}S.busy=false;render()}
function go(n){S.nav=n;window.scrollTo(0,0);render()}

async function boot(){
  try{
    var r=await sb.auth.getSession();var nu=r.data.session?r.data.session.user:null;if((nu?nu.id:null)!==(S.user?S.user.id:null)){S.form={svc:0,title:"",desc:"",addr:""};S.file=null;S.prev=null;S.unread={};S.stats=null;S.rate=null;S.fsvc=0}S.user=nu;S.prof=null;
    if(S.user){
      var q=await Promise.all([sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle(),sb.from("services").select("*").order("id")]);
      S.prof=q[0].data;S.services=q[1].data||[];if(!S.form.svc&&S.services[0])S.form.svc=S.services[0].id;
      S.nav=S.prof&&S.prof.role==="worker"?"jobs":"home";
    }
  }catch(x){fail(x)}
  S.chat=null;S.last="";render();setTimeout(refreshUnread,800);
}
sb.auth.onAuthStateChange(function(ev,sess){var uid=sess&&sess.user?sess.user.id:null;if(uid!==(S.user?S.user.id:null))boot()});
function gps(){
  if(!navigator.geolocation)return toast("Thiết bị không hỗ trợ GPS");
  toast("Đang lấy vị trí…");
  navigator.geolocation.getCurrentPosition(function(p){S.loc={lat:p.coords.latitude,lng:p.coords.longitude,gps:true};toast("Đã lấy vị trí GPS");render()},
  function(){toast("Không lấy được GPS. Hãy cho phép vị trí trong trình duyệt")},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function locChip(){return'<div class="chipcol"><button class="loc" data-gps="1">📍 '+(S.loc.gps?"Vị trí GPS":"Cao Lãnh")+' · cập nhật</button>'+modeChip()+'</div>'}
function bar(t,back){return'<div class="hero sm"><div class="top"><div class="hi">'+(back?'<button class="loc" data-go="'+back+'">←</button> ':"")+t+'</div></div></div><div class="pad" style="margin-top:16px">'}

/* ---------- Chat, đổi chế độ, thông báo ---------- */
function modeChip(){var w=S.prof.role==="worker";return'<button class="loc" data-mode="'+(w?"customer":"worker")+'">🔄 Chế độ '+(w?"Khách":"Thợ")+'</button>'}
function switchMode(to){act(async function(){var r=await sb.rpc("switch_role",{p_role:to});if(r.error)throw r.error;var p=await sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle();S.prof=p.data;S.nav=to==="worker"?"jobs":"home";S.last="";S.rate=null},"Đã chuyển sang chế độ "+(to==="worker"?"Thợ":"Khách"))}
function unreadTotal(c){var t=0;for(var k in S.unread)if(c===undefined||S.unread[k].c===c)t+=S.unread[k].n;return t}
function chatBtn(j,c){var u=S.unread[j.id],n=u?u.n:0;return'<div style="margin-top:10px"><button class="btn sec" data-chat="'+j.id+'" data-name="'+esc(c?c.full_name:"")+'" data-phone="'+esc(c?c.phone:"")+'">💬 Nhắn tin'+(n?' <span class="badge">'+n+' mới</span>':"")+'</button></div>'}
function drawNav(){var nv=$("nav");nv.hidden=false;nv.innerHTML=navHtml();nv.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}})}
async function refreshUnread(){
  if(!S.user||!S.prof)return;
  try{var r=await sb.rpc("unread_counts");if(r.error)return;var prev=unreadTotal(),u={};
    (r.data||[]).forEach(function(x){u[x.job_id]={n:x.n,c:x.is_customer}});S.unread=u;var t=unreadTotal();
    document.title=(t?"("+t+") ":"")+"Thợ Nhanh & Việc Nhanh";
    if(t>prev&&document.hidden&&window.Notification&&Notification.permission==="granted"){try{new Notification("Thợ Nhanh & Việc Nhanh",{body:"Bạn có tin nhắn mới"})}catch(e){}}
    if(!S.chat)drawNav()}catch(e){}
}
function closeChat(){if(S.ch){sb.removeChannel(S.ch);S.ch=null}var b=S.chat?S.chat.back:"home";S.chat=null;S.nav=b;S.last="";refreshUnread();render()}
function hm(t){var d=new Date(t),n=new Date(),h=d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});return d.toDateString()===n.toDateString()?h:d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"})+" "+h}
async function loadChat(first){
  var c=S.chat;if(!c)return;
  var r=await sb.from("messages").select("*").eq("job_id",c.id).order("id").limit(300);
  if(!S.chat||S.chat.id!==c.id)return;
  if(r.error){if(first)toast(r.error.message);return}
  var box=$("msgs");if(!box)return;
  var key=r.data.length+":"+(r.data.length?r.data[r.data.length-1].id:0);
  if(!first&&key===c.key)return;c.key=key;
  var near=first||(window.innerHeight+window.scrollY>=document.body.scrollHeight-180);
  box.innerHTML=r.data.length?r.data.map(function(m){return'<div class="b '+(m.sender_id===S.user.id?"me":"")+'"><div>'+esc(m.body).replace(/\n/g,"<br>")+'</div><small>'+hm(m.created_at)+'</small></div>'}).join(""):'<div class="empty">Chưa có tin nhắn.<br>Hãy chào và hẹn giờ với '+esc(c.name||"đối phương")+'.</div>';
  if(near)window.scrollTo(0,document.body.scrollHeight);
  sb.rpc("mark_read",{p_job:c.id}).then(function(){refreshUnread()});
}
async function sendMsg(){
  var i=$("c-in"),v=i.value.trim();if(!v||S.sending)return;S.sending=true;$("c-send").disabled=true;
  try{var r=await sb.rpc("send_message",{p_job:S.chat.id,p_body:v});if(r.error)throw r.error;i.value="";await loadChat(true)}catch(x){fail(x)}
  S.sending=false;var b=$("c-send");if(b)b.disabled=false;if(i)i.focus();
}
function renderChat(){
  var m=$("main"),c=S.chat,w=S.prof.role==="worker";$("nav").hidden=true;
  var Q=w?["Em đang trên đường tới ạ","Cho em xin địa chỉ chi tiết","Mình hẹn mấy giờ được ạ?"]:["Mấy giờ anh/chị qua được?","Em gửi thêm ảnh qua Zalo nhé","Giá dự kiến khoảng bao nhiêu ạ?"];
  m.innerHTML='<div class="hero sm"><div class="top"><div class="hi"><button class="loc" id="c-back">←</button> '+esc(c.name||"Nhắn tin")+'<small>Nhắn tin theo công việc</small></div>'+(c.phone?'<a class="lnk" href="tel:'+esc(c.phone)+'">📞 Gọi</a>':"")+'</div></div><div class="pad" style="margin-top:12px"><div id="msgs" class="msgs"></div></div>'+
  '<div class="chatbar"><div><div class="chips" style="padding-bottom:6px">'+Q.map(function(x){return'<button data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join("")+'</div><div class="row" style="align-items:flex-end"><textarea id="c-in" rows="1" maxlength="1000" placeholder="Nhập tin nhắn…" aria-label="Tin nhắn"></textarea><button class="btn sm" id="c-send" style="padding:12px 18px">Gửi</button></div></div></div>';
  $("c-back").onclick=closeChat;$("c-send").onclick=sendMsg;
  $("c-in").onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg()}};
  m.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){var i=$("c-in");i.value=b.dataset.q;i.focus()}});
  if(S.ch){sb.removeChannel(S.ch)}
  S.ch=sb.channel("chat-"+c.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"job_id=eq."+c.id},function(){loadChat(false)}).subscribe();
  loadChat(true);
}

function doAuth(){act(async function(){
  var ph=normPhone($("a-phone").value),pw=$("a-pass").value,em=ph+"@sdt.thonhanh.app";
  if(!/^0\d{9}$/.test(ph))throw new Error("Số điện thoại gồm 10 số, bắt đầu bằng 0");
  if(pw.length<6)throw new Error("Mật khẩu cần từ 6 ký tự");
  if(S.mode==="signup"){
    var n=$("a-name").value.trim();if(n.length<2)throw new Error("Hãy nhập họ tên");
    var r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:n,phone:ph,role:S.role}}});
    if(r.error)throw r.error;
    if(!r.data.session)throw new Error("Đã tạo tài khoản nhưng chưa đăng nhập được. Chủ web cần tắt Confirm email trong Supabase");
  }else{var r2=await sb.auth.signInWithPassword({email:em,password:pw});if(r2.error)throw r2.error}
})}

function radar(L){
  var R=100,c=120,h='<svg class="radar" viewBox="0 0 240 240" role="img" aria-label="Radar việc quanh bạn">';
  [1,.66,.33].forEach(function(f){h+='<circle cx="'+c+'" cy="'+c+'" r="'+R*f+'" fill="none" stroke="var(--line)" stroke-width="1.5"/>'});
  h+='<text x="'+(c+R-2)+'" y="'+(c-5)+'" text-anchor="end" font-size="10" fill="var(--mut)">'+S.radius+' km</text>';
  L.forEach(function(j){var dx=(j.lng-S.loc.lng)*Math.cos(S.loc.lat*Math.PI/180),dy=j.lat-S.loc.lat,m=Math.sqrt(dx*dx+dy*dy)||1,f=Math.min(j.distance_km/S.radius,1),x=c+dx/m*f*R,y=c-dy/m*f*R;
    h+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="11" fill="#ffc928" stroke="#14263a" stroke-width="1.5"/><text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="middle" font-size="11">'+svc(j.service_id).icon+'</text>'});
  return h+'<circle cx="'+c+'" cy="'+c+'" r="6" fill="#14263a"/></svg>';
}

    $("a-go").onclick=doAuth;["a-phone","a-pass"].forEach(function(i){$(i).onkeydown=function(e){if(e.key==="Enter")doAuth()}});return}
  if(!S.prof){nv.hidden=true;m.innerHTML='<div class="empty" style="padding-top:60px">Chưa có hồ sơ cho tài khoản này. Hãy chạy đủ các file SQL trong Supabase rồi đăng ký lại.<br><br><button class="btn sec sm" id="b-out">Đăng xuất</button></div>';$("b-out").onclick=function(){sb.auth.signOut()};return}
  if(S.chat){renderChat();return}
  var w=S.prof.role==="worker";if(w&&["home","mine","post","hist"].indexOf(S.nav)>=0)S.nav="jobs";if(!w&&["jobs","taken"].indexOf(S.nav)>=0)S.nav="home";
  drawNav();
  if(S.last!==S.nav){m.innerHTML=SKEL;S.last=S.nav}
  var html;
  try{
    if(S.nav==="home"){var st=await sb.rpc("home_stats");S.stats=st.error?null:st.data;html=await viewHome()}
    else if(S.nav==="mine")html=await viewList(false);else if(S.nav==="hist")html=await viewList(true);
    else if(S.nav==="post")html=viewPost();else if(S.nav==="jobs")html=await viewJobs();else if(S.nav==="taken")html=await viewTaken();else html=await viewMe();
  }catch(x){html=bar("")+'<div class="empty">'+esc(x.message||"Không tải được dữ liệu")+'<br><br><button class="btn sec sm" id="b-re">Thử lại</button></div></div>'}
  if(id!==S.rid)return;
  m.innerHTML=html;
  function on(sel,fn){m.querySelectorAll(sel).forEach(fn)}
  [m,nv].forEach(function(root){root.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}})});
  on("[data-gps]",function(b){b.onclick=gps});
  on("[data-share]",function(b){b.onclick=function(){var d={title:"Thợ Nhanh & Việc Nhanh",text:"Tìm thợ sửa chữa tại nhà, miễn phí đăng tin",url:location.href.split("#")[0]};
    if(navigator.share)navigator.share(d).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(d.url).then(function(){toast("Đã chép link, gửi cho bạn bè nhé")})}});
  on("[data-sub]",function(b){b.onclick=function(){var p=b.dataset.sub.split("|");S.form.svc=+p[0];S.form.title=p[1]||"";go("post")}});
  on("[data-svc]",function(b){b.onclick=function(){S.form.svc=+b.dataset.svc;render()}});
  on("[data-fill]",function(b){b.onclick=function(){S.form.title=b.dataset.fill;render()}});
  on("[data-f]",function(b){b.onclick=function(){S.fsvc=+b.dataset.f;render()}});
  on("[data-a]",function(b){b.onclick=function(){var a=b.dataset.a;act(async function(){var r=await sb.rpc("unlock_job",{p_job:a});if(r.error)throw r.error;S.nav="taken"},"Đã nhận việc. Số điện thoại khách đã hiện")}});
  on("[data-cancel]",function(b){b.onclick=function(){if(!confirm("Hủy tin này?"))return;var a=b.dataset.cancel;act(async function(){var r=await sb.rpc("cancel_job",{p_job:a});if(r.error)throw r.error},"Đã hủy tin")}});
  on("[data-rate]",function(b){b.onclick=function(){S.rate=b.dataset.rate;S.stars=0;S.comment="";render()}});
  on("[data-star]",function(b){b.onclick=function(){var c=$("r-cm");if(c)S.comment=c.value;S.stars=+b.dataset.star;render()}});
  var ok=$("r-ok");if(ok)ok.onclick=function(){var c=$("r-cm").value;if(!S.stars)return toast("Hãy chọn số sao");var jid=S.rate;act(async function(){var r=await sb.rpc("complete_job",{p_job:jid,p_stars:S.stars,p_comment:c});if(r.error)throw r.error;S.rate=null},"Cảm ơn bạn đã đánh giá")};
  var no=$("r-no");if(no)no.onclick=function(){S.rate=null;render()};
  on("[data-mode]",function(b){b.onclick=function(){switchMode(b.dataset.mode)}});
  on("[data-chat]",function(b){b.onclick=function(){S.chat={id:b.dataset.chat,name:b.dataset.name,phone:b.dataset.phone,back:S.nav};render()}});
  on("[data-release]",function(b){b.onclick=function(){if(!confirm("Trả việc này? Tin sẽ mở lại cho thợ khác và cuộc trò chuyện sẽ bị xóa."))return;var a=b.dataset.release;act(async function(){var r=await sb.rpc("release_job",{p_job:a});if(r.error)throw r.error},"Đã trả việc")}});
  on("[data-notif]",function(b){b.onclick=function(){Notification.requestPermission().then(function(){render()})}});
  var ps=$("p-save");if(ps)ps.onclick=function(){var n=$("p-name").value.trim();if(n.length<2)return toast("Hãy nhập họ tên");act(async function(){var r=await sb.from("profiles").update({full_name:n}).eq("id",S.user.id);if(r.error)throw r.error;S.prof.full_name=n},"Đã lưu tên")};
  var pw=$("p-pwb");if(pw)pw.onclick=function(){var v=$("p-pw").value;if(v.length<6)return toast("Mật khẩu cần từ 6 ký tự");act(async function(){var r=await sb.auth.updateUser({password:v});if(r.error)throw r.error},"Đã đổi mật khẩu")};
  var p=$("b-post");if(p)p.onclick=post;
  var re=$("b-re");if(re)re.onclick=render;
  var bo=$("b-out");if(bo)bo.onclick=function(){S.rate=null;sb.auth.signOut()};
  var f=$("f-img");if(f)f.onchange=function(){var x=f.files[0];if(x&&x.size>15*1048576){f.value="";return toast("Ảnh quá lớn, chọn ảnh dưới 15 MB")}S.file=x||null;S.prev=x?URL.createObjectURL(x):null;render()};
  var t=$("f-title");if(t){t.oninput=function(e){S.form.title=e.target.value};$("f-desc").oninput=function(e){S.form.desc=e.target.value};$("f-addr").oninput=function(e){S.form.addr=e.target.value}}
  var rd=$("f-rad");if(rd){rd.oninput=function(){$("rad-l").textContent="Bán kính tìm việc: "+rd.value+" km"};rd.onchange=function(){S.radius=+rd.value;render()}}
  var q=$("q");if(q){q.oninput=function(){var v=norm(q.value.trim()),sg=$("sug");if(!v){sg.hidden=true;return}
    var A=[];S.services.forEach(function(s){A.push([s.id,s.icon,s.name]);(SUBS[s.slug]||[]).forEach(function(x){var p=x.split("|");A.push([s.id,p[0],p[1]])})});
    var R=A.filter(function(a){return norm(a[2]).indexOf(v)>=0}).slice(0,6);
    sg.innerHTML=R.length?R.map(function(a){return'<button data-sub="'+a[0]+"|"+esc(a[2])+'"><span>'+a[1]+'</span>'+esc(a[2])+'</button>'}).join(""):'<button data-sub="'+(S.form.svc||1)+"|"+esc(q.value.trim())+'"><span>✏️</span>Đăng tin: '+esc(q.value.trim())+'</button>';
    sg.hidden=false;sg.querySelectorAll("[data-sub]").forEach(function(b){b.onclick=function(){var p=b.dataset.sub.split("|");S.form.svc=+p[0];S.form.title=p[1]||"";go("post")}})}}
}
setInterval(function(){if(S.user&&S.prof&&S.prof.role==="worker"&&S.nav==="jobs"&&!S.chat&&!document.hidden&&!S.busy)render()},30000);
setInterval(function(){if(S.chat&&!document.hidden)loadChat(false)},5000);
setInterval(function(){if(S.user&&!document.hidden)refreshUnread()},15000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshUnread()});
boot();
})();
</script>
</body>
</html>
